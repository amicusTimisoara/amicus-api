name: Deploy

on:
  # Every merge to main deploys STAGE.
  push:
    branches: [main]
  # A published GitHub Release deploys PROD.
  release:
    types: [published]
  # Manual: pick the environment.
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [stage, prod]
        default: stage

permissions:
  contents: read

# Never deploy two commits over each other; let a run finish.
concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || 'stage' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runner on the Pi, running as the unprivileged user `amicus`. The repo
    # guard below only stops a fork running THIS file; what limits a hostile workflow is
    # that user, plus fork PRs needing approval (README "Running on the Raspberry Pi").
    runs-on: [self-hosted, pi]
    if: github.repository == 'amicusTimisoara/amicus-api'
    steps:
      - uses: actions/checkout@v5

      # Event values reach scripts only through env, never as ${{ }} inside them,
      # and the environment name is checked against the two real ones.
      - name: Resolve environment
        id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_ENVIRONMENT" in
              stage|prod) echo "name=$INPUT_ENVIRONMENT" >> "$GITHUB_OUTPUT" ;;
              *) echo "unknown environment: $INPUT_ENVIRONMENT"; exit 2 ;;
            esac
          else
            echo "name=stage" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          DEPLOY_ENV: ${{ steps.env.outputs.name }}
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
